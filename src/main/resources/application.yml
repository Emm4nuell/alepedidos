server:
  port: 8080
  servlet:
    context-path: "/scheduling"

spring:

  application:
    name: "scheduling"

  datasource:
    url: "${LOCAL_DATABASE_URL}"
    username: "${LOCAL_DATABASE_USER}"
    password: "${LOCAL_DATABASE_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    url: "${LOCAL_DATABASE_URL}"
    user: "${LOCAL_DATABASE_USER}"
    password: "${LOCAL_DATABASE_PASSWORD}"


