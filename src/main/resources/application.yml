server:
  port: 8080

spring:

  application:
    name: "AlePedidos"

  datasource:
    url: "${DATABASE_URL}"
    username: "${DATABASE_USER}"
    password: "${DATABASE_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    url: "${DATABASE_URL}"
    user: "${DATABASE_USER}"
    password: "${DATABASE_PASSWORD}"


